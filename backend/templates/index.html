<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{ title }}</title><link rel="stylesheet" href="/static/styles.css"/></head><body><main>
<h1>{{ title }}</h1><p class="sub">Give a theme — get a week of dated posts across your channel.</p>
<div class="grid"><section class="card"><h2>Plan a week</h2>
<form method="post" action="/ui/plan"><label>Theme</label><input name="theme" required placeholder="offline AI productivity"/>
<label>Channel</label><input name="channel" value="linkedin"/><button type="submit">Generate calendar</button></form></section>
<section class="card"><h2>Calendar</h2><table><thead><tr><th>When</th><th>Post</th><th>Channel</th></tr></thead><tbody>
{% for p in posts %}<tr><td>{{ p.publish_at }}</td><td>{{ p.title }}</td><td>{{ p.channel }}</td></tr>
{% else %}<tr><td colspan="3">No posts planned.</td></tr>{% endfor %}
</tbody></table></section></div></main></body></html>
