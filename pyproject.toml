[project]
name = "content-calendar-agent"
version = "2.0.0"
description = "Content planner that proposes a week of posts and parks them on a calendar with channel metadata."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
